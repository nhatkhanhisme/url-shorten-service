spring:
  application:
    name: url-shortener
  
  server:
    port: 8080
  
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties-hibernate:
      format_sql: true
  
logging:
  level:
    org:springframework: INFO
    dev.khanh.url_shortener: DEBUG
