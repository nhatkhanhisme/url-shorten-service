<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Shortener</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 520px;
    padding: 32px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 4px;
    color: #1f2937;
  }
  p.subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 24px;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #4338ca; }
  button:disabled {
    background: #a5a6f6;
    cursor: not-allowed;
  }
  .result, .error {
    margin-top: 24px;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
  }
  .result {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
  }
  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
  }
  .result-row .label {
    color: #4b5563;
    font-weight: 500;
    white-space: nowrap;
  }
  .result-row .value {
    text-align: right;
    word-break: break-all;
  }
  .short-link {
    color: #4f46e5;
    font-weight: 600;
    text-decoration: none;
  }
  .short-link:hover { text-decoration: underline; }
  .copy-btn {
    margin-left: 8px;
    border: none;
    background: #e5e7eb;
    color: #374151;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .copy-btn:hover { background: #d1d5db; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL below to generate a short link.</p>

    <form id="shorten-form">
      <input type="text" id="url-input" placeholder="https://example.com/very/long/url" autocomplete="off" required>
      <button type="submit" id="submit-btn">Shorten</button>
    </form>

    <div id="result" class="result hidden"></div>
    <div id="error" class="error hidden"></div>
  </div>

<script>
  const form = document.getElementById('shorten-form');
  const input = document.getElementById('url-input');
  const submitBtn = document.getElementById('submit-btn');
  const resultBox = document.getElementById('result');
  const errorBox = document.getElementById('error');

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value;
    return div.innerHTML;
  }

  function showResult(data) {
    const shortUrl = `${window.location.origin}/shorten/${data.shortCode}`;
    resultBox.innerHTML = `
      <div class="result-row"><span class="label">Original URL</span><span class="value">${escapeHtml(data.url)}</span></div>
      <div class="result-row"><span class="label">Short URL</span>
        <span class="value">
          <a class="short-link" href="${shortUrl}" target="_blank" rel="noopener">${shortUrl}</a>
          <button type="button" class="copy-btn" id="copy-btn">Copy</button>
        </span>
      </div>
      <div class="result-row"><span class="label">Short code</span><span class="value">${escapeHtml(data.shortCode)}</span></div>
      <div class="result-row"><span class="label">Access count</span><span class="value">${data.accessCount}</span></div>
      <div class="result-row"><span class="label">Created at</span><span class="value">${new Date(data.createdAt).toLocaleString()}</span></div>
    `;
    resultBox.classList.remove('hidden');
    errorBox.classList.add('hidden');

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(shortUrl);
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    });
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
    resultBox.classList.add('hidden');
  }

  function extractErrorMessage(body) {
    if (!body || !body.error) return 'Something went wrong. Please try again.';
    if (Array.isArray(body.error)) return body.error.join(', ');
    return String(body.error);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const url = input.value.trim();
    if (!url) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Shortening...';

    try {
      const response = await fetch('/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        showError(extractErrorMessage(data));
        return;
      }

      showResult(data);
    } catch (err) {
      showError('Could not reach the server. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Shorten';
    }
  });
</script>
</body>
</html>
